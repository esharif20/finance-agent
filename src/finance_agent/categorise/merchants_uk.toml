# --- keyword rules (after the Merchant base, before Uncategorised) ----------
# Pattern is an upper-case regex on the raw descriptor, like RULES in code.

[[rule]]
id = "takeaway-words"
pattern = '\b(TAKEAWAY|KEBAB|PIZZERIA|CHIPPY|FISH BAR|CHINESE|CURRY HOUSE|TANDOORI|SHAWARMA)\b'
category = "Food & Drink/Takeaway"

[[rule]]
id = "coffee-words"
pattern = '\b(COFFEE|ESPRESSO|CAFFE|COFFEE SHOP|ROASTERS?)\b'
category = "Food & Drink/Coffee"

[[rule]]
id = "eating-out-words"
pattern = '\b(RESTAURANT|BISTRO|BRASSERIE|TAVERN|GASTROPUB|STEAKHOUSE|TRATTORIA|OSTERIA|BAR & GRILL)\b'
category = "Food & Drink/Eating out"

[[rule]]
id = "pub-words"
pattern = '\b(PUB|INN|ARMS|TAP ROOM|ALEHOUSE|BREWERY|BREWING)\b'
category = "Food & Drink/Eating out"

[[rule]]
id = "grocery-words"
pattern = '\b(SUPERMARKET|GROCER|GROCERS|GREENGROCER|BUTCHER|BUTCHERS|BAKERY|FISHMONGER|DELI|CONVENIENCE)\b'
category = "Food & Drink/Groceries"

[[rule]]
id = "rail-words"
pattern = '\b(RAILWAY|RAIL TICKETS?|TRAIN TICKETS?|BUS FARE|TRAMS?|UNDERGROUND)\b'
category = "Transport/Public transport"

[[rule]]
id = "fuel-words"
pattern = '\b(DIESEL|UNLEADED|FORECOURT|FILLING STATION|SERVICE STATION|GARAGE FUEL)\b'
category = "Transport/Fuel"

# PFS: the banks' "petrol filling station" suffix (BP, Shell and independents)
[[rule]]
id = "fuel-pfs"
pattern = '\bPFS\b'
category = "Transport/Fuel"

[[rule]]
id = "parking-words"
pattern = '\b(CAR PARKS?|CARPARK|PAY AND DISPLAY|PAY & DISPLAY|PARK AND RIDE|PARK & RIDE)\b'
category = "Transport/Parking"

[[rule]]
id = "water-words"
pattern = '\b(WATER SERVICES|WATER BILL|WATER PLC)\b'
category = "Bills/Water"

[[rule]]
id = "energy-words"
pattern = '\b(ENERGY SUPPLY|GAS AND ELECTRIC|ELECTRICITY|ELECTRIC BILL)\b'
category = "Bills/Energy"

[[rule]]
id = "broadband-words"
pattern = '\b(BROADBAND|TELECOM|TELECOMS|FIBRE)\b'
category = "Bills/Phone & broadband"

[[rule]]
id = "insurance-words"
pattern = '\b(INSURANCE|ASSURANCE|INSURE)\b'
category = "Bills/Insurance"

[[rule]]
id = "mortgage-words"
pattern = '\bMORTGAGE\b'
category = "Bills/Rent or mortgage"

[[rule]]
id = "council-words"
pattern = '\b(COUNCIL|BOROUGH)\b'
category = "Bills/Council tax"

[[rule]]
id = "tax-words"
pattern = '\b(HMRC|HM REVENUE|SELF ASSESSMENT|PAYE|VAT PAYMENT)\b'
