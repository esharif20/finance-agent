# UK merchant and keyword base (#215). Data, not code: loaded once by
# categorise/__init__.py. Taxonomy v2 Category ids ("Top/Sub"); a test checks
# every one exists.
#
# Matching runs on the upper-cased descriptor with `*` and apostrophes
# removed and spaces collapsed. A token matches on word boundaries anywhere in
# the descriptor, so "SQ *" or "PAYPAL *" prefixes do not matter. Spelling:
#   "^TOKEN"  only at the start (short or common words)
#   "TOKEN*"  no word boundary after it (AMZN*, for AMZNMKTPLACE)
# Order is the precedence: [[sub_brand]] groups first (TESCO PFS before
# TESCO), then [[base]] groups; the first Merchant that matches wins. A
# Merchant without `match` matches its own upper-cased name.
# Public brand names only; no real account data.

# --- sub-brands: one retailer, a different kind of purchase -----------------

[[sub_brand]]
category = "Transport/Fuel"
merchants = [
  { name = "Tesco Fuel", match = ["^TESCO PFS", "^TESCO PETROL", "^TESCO FUEL"] },
  { name = "Sainsbury's Fuel", match = ["^SAINSBURYS PFS", "^SAINSBURYS PETROL", "^SAINSBURYS FUEL", "^SAINSBURYS S/MKTS PFS"] },
  { name = "Asda Fuel", match = ["^ASDA PFS", "^ASDA PETROL", "^ASDA FUEL", "^ASDA EXPRESS PFS"] },
  { name = "Morrisons Fuel", match = ["^MORRISONS PFS", "^MORRISONS PETROL", "^MORRISONS FUEL", "^MORRISONS DAILY FUEL"] },
  { name = "Co-op Fuel", match = ["^CO-OP FUEL", "^CO-OP PETROL", "^COOP PFS"] },
  { name = "M&S Fuel", match = ["^M&S PFS", "^M&S PETROL", "^MARKS & SPENCER PFS"] },
  { name = "Costco Fuel", match = ["^COSTCO PFS", "^COSTCO PETROL", "^COSTCO FUEL"] },
]

[[sub_brand]]
category = "Bills/Phone & broadband"
merchants = [
  { name = "Tesco Mobile", match = ["^TESCO MOBILE"] },
  { name = "Sainsbury's Mobile", match = ["^SAINSBURYS MOBILE"] },
