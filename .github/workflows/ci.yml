name: CI
on:
  pull_request:
  push:
    branches: [main]

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the full history
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: gitleaks
        run: gitleaks git . --no-banner --redact
      - run: uv sync --locked
      - name: fixture guard
        run: uv run python scripts/fixture_guard.py
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run lint-imports

  python-tests:
    name: python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - run: uv run pytest -n auto

  evals:
    name: evals
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: categoriser eval (blocks on regression)
        run: |
          uv run python evals/categoriser.py
          uv run python evals/categoriser_gate.py
      - name: detector, baseline, ranking, forecast and playbook evals (results reproduce)
        run: |
          uv run python evals/detectors.py
          uv run python evals/baselines.py
          uv run python evals/ranking.py
          uv run python evals/forecast.py
          uv run python evals/playbook.py
      - name: assistant benchmark on FakeChatModel (results reproduce)
        run: uv run python evals/assistant_bench.py

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - name: OpenAPI types are current
        run: |
          pnpm --dir web run gen
          git diff --exit-code -- web/openapi.json web/src/api/schema.d.ts
      - run: pnpm --dir web run build
      - run: pnpm --dir web run test
      # The demo builds, and its Python Function (deps, src, Personas) fits Vercel's
      # bundle limit for Python, 500 MB uncompressed:
      # https://vercel.com/docs/functions/runtimes/python (over it, deploy on Render).
      - name: Demo build and function bundle size
        env:
          LIMIT_MB: 500
        run: |
          export FA_DEMO=1 FA_DEMO_DIR="$RUNNER_TEMP/demo" FA_DEMO_SECRET="$(openssl rand -hex 24)"
          mkdir -p "$FA_DEMO_DIR"
          sh scripts/build_demo.sh
          uv export --frozen --no-dev --no-emit-project --no-hashes -o "$RUNNER_TEMP/req.txt"
          uv pip install --target "$RUNNER_TEMP/bundle" --python-version 3.12 -r "$RUNNER_TEMP/req.txt"
          cp -R src/finance_agent api "$FA_DEMO_DIR/personas" "$RUNNER_TEMP/bundle/"
          size=$(du -sm "$RUNNER_TEMP/bundle" | cut -f1)
          echo "demo function bundle: ${size} MB of ${LIMIT_MB} MB"
          test "$size" -le "$LIMIT_MB"

  smoke:
    name: smoke (webkit)
    runs-on: ubuntu-24.04  # Playwright 1.58 has no WebKit build for ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web run build
      # smoke.mjs loads Playwright from the global npm root; it is not a repo dependency
      - run: npm install -g playwright@1.58.2
      - id: pw
        run: echo "v=$(playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ steps.pw.outputs.v }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: playwright install --with-deps webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: playwright install-deps webkit
      - run: pnpm --dir web run smoke
      - run: pnpm --dir web run smoke:demo

  # Branch protection requires a check named `checks`; this aggregates the rest.
  checks:
    name: checks
    if: always()
    needs: [lint, python-tests, evals, web, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: every job must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
