[project]
name = "finance-agent"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest", "hypothesis", "ruff", "pyright", "import-linter"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["scripts", "tests"]
typeCheckingMode = "strict"

# Later tickets extend the contracts; docs/ARCHITECTURE.md "Modules" is the source.
[tool.importlinter]
root_package = "finance_agent"

[[tool.importlinter.contracts]]
name = "placeholder: storage never imports api"
type = "forbidden"
source_modules = ["finance_agent.storage"]
forbidden_modules = ["finance_agent.api"]
